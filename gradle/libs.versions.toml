[versions]
agp = "8.13.2"
kotlin = "2.4.21"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
datastore = "1.2.1"
coreKtx = "1.18.0"
serialization = "1.11.0"
coroutines = "1.11.0"
junit = "4.13.2"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
# Compose ui-test pulls Espresso 3.5.0, whose InputManager reflection fails on API 37.
espresso = "3.7.0"
# Cardboard SDK transitive dependencies, verbatim from third_party/cardboard/sdk/build.gradle.
cardboardAppcompat = "1.6.1"
cardboardPlayServicesVision = "20.1.3"
cardboardMaterial = "1.12.0"
cardboardProtobufJavalite = "3.19.4"
cardboardJspecify = "1.0.0"
# Bundled content (Task 12): commit SHAs of the projectM content repos, fetched at build time.
# https://github.com/projectM-visualizer/presets-projectm-classic (the Koggles Starter Pack is a
# hash-pinned selection from it: app/bundled-presets.txt)
classicSha = "14a6244a7d32eb7e114e1a92d1cb93358cdcc54a"
# https://github.com/projectM-visualizer/presets-milkdrop-texture-pack
texturePackSha = "6368812f27bc747b517218fbf89d21d59afce4d9"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "cardboardAppcompat" }
play-services-vision = { module = "com.google.android.gms:play-services-vision", version.ref = "cardboardPlayServicesVision" }
material = { module = "com.google.android.material:material", version.ref = "cardboardMaterial" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "cardboardProtobufJavalite" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "cardboardJspecify" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
